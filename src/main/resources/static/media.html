<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>通勤素材包 · 我的玩具</title>
<style>
:root { --bg:#0d1117; --bg2:#161b22; --bg3:#21262d; --border:#30363d; --text:#c9d1d9; --text2:#8b949e; --orange:#f77f00; --green:#3fb950; --red:#f85149; --blue:#58a6ff; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
.topbar { background:linear-gradient(180deg,#160826,#1a0a20); padding:10px 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; }
.topbar a { color:var(--text2); text-decoration:none; font-size:14px; }
.topbar a:hover { color:var(--orange); }
.topbar .logo { font-size:16px; font-weight:700; color:var(--orange); }
.container { max-width:800px; margin:0 auto; padding:20px 16px; }

.card { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:14px; }
.card h2 { font-size:17px; color:var(--orange); margin-bottom:4px; }
.card .sub { font-size:12px; color:var(--text2); margin-bottom:14px; }

/* checkboxes */
.check-group { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.check-group label { display:flex; align-items:center; gap:6px; padding:6px 14px; background:var(--bg3); border:1px solid var(--border); border-radius:8px; font-size:13px; cursor:pointer; transition:all .2s; user-select:none; }
.check-group label:hover { border-color:var(--orange); }
.check-group label.checked { background:rgba(247,127,0,.12); border-color:var(--orange); color:var(--orange); }
.check-group input[type=checkbox] { display:none; }
.check-group label .del { margin-left:2px; color:var(--text2); font-size:11px; cursor:pointer; padding:1px 4px; border-radius:3px; }
.check-group label .del:hover { color:var(--red); background:rgba(248,81,73,.15); }

.input-row { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
.input-row input, .input-row select, .input-row textarea { flex:1; min-width:180px; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:8px 12px; border-radius:8px; font-size:13px; }
.input-row textarea { min-height:120px; resize:vertical; font-family:inherit; }
.input-row input::placeholder, .input-row textarea::placeholder { color:var(--text2); }

.btn { padding:9px 20px; border-radius:8px; font-size:13px; cursor:pointer; border:none; font-weight:600; transition:all .2s; }
.btn-primary { background:var(--orange); color:#fff; width:100%; }
.btn-primary:hover { background:#e06b00; }
.btn-primary:disabled { opacity:.5; cursor:not-allowed; }
.btn-sm { padding:5px 12px; font-size:11px; }
.btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
.btn-outline:hover { border-color:var(--orange); color:var(--orange); }
.btn-green { background:var(--green); color:#000; }
.btn-green:hover { opacity:.85; }
.btn-block { width:100%; }

/* category tabs */
.cat-tabs { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:12px; }
.cat-tab { padding:5px 12px; font-size:12px; color:var(--text2); background:var(--bg3); border:1px solid var(--border); border-radius:6px; cursor:pointer; transition:all .2s; }
.cat-tab:hover { color:var(--text); border-color:var(--text2); }
.cat-tab.on { background:rgba(247,127,0,.12); border-color:var(--orange); color:var(--orange); }
.cat-tab .count { font-size:10px; background:rgba(139,148,158,.15); padding:1px 5px; border-radius:6px; margin-left:3px; }

/* result */
.result { margin-top:16px; }
.result .pack { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:16px; white-space:pre-wrap; font-size:13px; line-height:1.7; max-height:60vh; overflow-y:auto; }
.pack hr { border:none; border-top:2px dashed var(--border); margin:14px 0; }
.pack .hl { color:var(--orange); font-weight:600; }

.review-bar { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.review-bar input { flex:1; min-width:200px; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:8px 12px; border-radius:8px; font-size:13px; }
.review-bar input::placeholder { color:var(--text2); }
.action-bar { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }

/* materials */
.mat-card { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:8px; }
.mat-card .mat-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
.mat-card .mat-title { font-size:13px; font-weight:600; color:var(--orange); }
.mat-card .mat-cat { font-size:10px; padding:1px 6px; border-radius:6px; background:rgba(88,166,255,.12); color:var(--blue); }
.mat-card .mat-preview { font-size:12px; color:var(--text2); white-space:pre-wrap; max-height:60px; overflow:hidden; }
.mat-card .mat-actions { margin-top:6px; display:flex; gap:6px; }
.mat-card .mat-time { font-size:11px; color:var(--text2); }

/* manual input form */
.manual-form { display:none; margin-top:12px; padding:16px; background:var(--bg); border:1px solid var(--border); border-radius:8px; }
.manual-form.on { display:block; }

.spinner { display:inline-block; width:16px; height:16px; border:2px solid var(--border); border-top-color:#fff; border-radius:50%; animation:spin .6s linear infinite; margin-right:6px; vertical-align:middle; }
@keyframes spin { to{transform:rotate(360deg);} }
.empty { text-align:center; color:var(--text2); padding:24px; font-size:14px; }

/* mobile */
@media (max-width:600px) {
  .container { padding:10px; }
  .card { padding:14px; }
  .check-group label { padding:5px 10px; font-size:12px; }
  .review-bar { flex-direction:column; }
  .cat-tabs { gap:2px; }
  .cat-tab { padding:4px 8px; font-size:11px; }
  #oneoffTopic, #oneoffReq { font-size:13px !important; padding:6px 10px !important; min-width:100%; }
}
</style>
</head>
<body>

<div class="topbar">
  <a href="/">← 返回</a>
  <span class="logo">🚄 通勤素材包</span>
</div>

<div class="container">

  <!-- Step 1: Generate -->
  <div class="card">
    <h2>🎬 生成通勤素材</h2>
    <div class="sub">勾选话题，一键生成</div>

    <div class="check-group" id="topicChecks">
      <!-- 默认话题 hardcoded，自定义话题从 localStorage 恢复 -->
    </div>
    <div class="input-row" id="topicInputRow" style="display:none;">
      <input id="newTopicInput" placeholder="输入自定义话题，如「加班」「团建」...">
      <button class="btn btn-sm btn-outline" onclick="addCustomTopic()">添加</button>
      <button class="btn btn-sm btn-outline" onclick="hideTopicInput()" style="color:var(--text2);">✕</button>
    </div>
    <div class="input-row" style="margin-top:6px;">
      <input id="oneoffTopic" placeholder="💬 单次话题（临时输入，不保存到列表）" style="font-size:12px;">
    </div>

    <!-- 额外要求：多选 -->
    <div class="sub" style="margin-bottom:6px;">🎯 额外要求（多选，可不选）</div>
    <div class="check-group" id="reqChecks"></div>
    <div class="input-row" id="reqInputRow" style="display:none;">
      <input id="newReqInput" placeholder="输入自定义要求，如「用晋中方言」「突出工资对比」...">
      <button class="btn btn-sm btn-outline" onclick="addCustomReq()">添加</button>
      <button class="btn btn-sm btn-outline" onclick="hideReqInput()" style="color:var(--text2);">✕</button>
    </div>
    <div class="input-row" style="margin-top:6px;">
      <input id="oneoffReq" placeholder="💬 单次要求（临时输入，不保存到列表）" style="font-size:12px;">
    </div>

    <div class="input-row">
      <input id="weatherInfo" placeholder="天气（自动预填）">
    </div>

    <button class="btn btn-primary" onclick="generate()" id="genBtn">⚡ 生成脚本</button>

    <div class="result" id="result"></div>
  </div>

  <!-- Materials -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
      <h2 style="margin:0;">📚 素材库</h2>
      <button class="btn btn-sm btn-outline" onclick="toggleManual()">✏️ 手动录入</button>
    </div>

    <!-- category tabs -->
    <div class="cat-tabs" id="catTabs">
      <span class="cat-tab on" data-cat="">全部<span class="count" id="cntAll">0</span></span>
      <span class="cat-tab" data-cat="通勤">🚄通勤<span class="count" id="cnt通勤">0</span></span>
      <span class="cat-tab" data-cat="工资">💰工资<span class="count" id="cnt工资">0</span></span>
      <span class="cat-tab" data-cat="老婆">👩‍🎓老婆<span class="count" id="cnt老婆">0</span></span>
      <span class="cat-tab" data-cat="带娃">👶带娃<span class="count" id="cnt带娃">0</span></span>
      <span class="cat-tab" data-cat="大厂">🏢大厂<span class="count" id="cnt大厂">0</span></span>
      <span class="cat-tab" data-cat="其他">📝其他<span class="count" id="cnt其他">0</span></span>
    </div>

    <!-- manual input -->
    <div class="manual-form" id="manualForm">
      <div class="input-row">
        <input id="manTitle" placeholder="素材标题">
        <select id="manCat" class="cat-select">
          <option value="通勤">🚄 通勤</option>
          <option value="工资">💰 工资</option>
          <option value="老婆">👩‍🎓 老婆</option>
          <option value="带娃">👶 带娃</option>
          <option value="大厂">🏢 大厂</option>
          <option value="其他">📝 其他</option>
        </select>
      </div>
      <div class="input-row">
        <input id="manCustomCat" placeholder="自定义类目（选「其他」时可填）" style="min-width:140px;">
      </div>
      <textarea id="manContent" class="input-row" style="width:100%;min-height:150px;margin-bottom:8px;" placeholder="粘贴或手写素材内容..."></textarea>
      <button class="btn btn-green btn-block" onclick="saveManual()">💾 保存到素材库</button>
    </div>

    <div id="materialList"><div class="empty">暂无素材，生成后点「✅ 采纳」或手动录入</div></div>
  </div>

</div>

<script>
var _ls=localStorage;var TOKEN=_ls.getItem('token')||'';
let activeCat = '';
let allCategories = [];  // 从后端加载
if (!TOKEN) { document.body.innerHTML = '<div class="empty" style="margin-top:60px;">⚠ 请先<a href="/">登录</a></div>'; }

function api(path, opts) {
  return fetch(window.location.origin + path, {
    ...opts,
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+TOKEN, ...(opts&&opts.headers||{}) }
  }).then(r => r.json());
}

// --- load categories ---
function loadCategories() {
  api('/media/categories').then(cats => {
    allCategories = Array.isArray(cats) && cats.length > 0 ? cats : FALLBACK_CATS;
    renderCatTabs();
    renderCatDropdowns();
  }).catch(() => {
    allCategories = FALLBACK_CATS;
    renderCatTabs();
    renderCatDropdowns();
  });
}

const FALLBACK_CATS = [
  {name:'通勤',emoji:'🚄'},{name:'工资',emoji:'💰'},{name:'老婆',emoji:'👩‍🎓'},
  {name:'带娃',emoji:'👶'},{name:'大厂',emoji:'🏢'},{name:'其他',emoji:'📝'}
];

function renderCatTabs() {
  const container = document.getElementById('catTabs');
  let html = '<span class="cat-tab on" data-cat="">全部<span class="count" id="cntAll">0</span></span>';
  allCategories.forEach(c => {
    html += '<span class="cat-tab" data-cat="' + escAttr(c.name) + '">' + (c.emoji||'') + escHtml(c.name) + '<span class="count" id="cnt' + c.name + '">0</span></span>';
  });
  container.innerHTML = html;
  container.addEventListener('click', function(e) {
    const tab = e.target.closest('.cat-tab');
    if (!tab) return;
    container.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('on'));
    tab.classList.add('on');
    activeCat = tab.dataset.cat;
    loadMaterials();
  });
}

function renderCatDropdowns() {
  const selects = document.querySelectorAll('.cat-select');
  let opts = '';
  allCategories.forEach(c => {
    opts += '<option value="' + escAttr(c.name) + '">' + (c.emoji||'') + ' ' + escHtml(c.name) + '</option>';
  });
  selects.forEach(s => { s.innerHTML = opts; });
}

// ============ 持久化存储 ============
const LS_TOPICS = 'media_custom_topics';
const LS_REQS = 'media_custom_reqs';
const DEFAULT_TOPICS = [
  {name:'周五回太原',emoji:'🚄'},
  {name:'周末日常',emoji:'🏠'},
  {name:'周一返京',emoji:'🏢'}
];
const DEFAULT_REQS = [
  {name:'节奏快（15秒内）'},
  {name:'加强冲突/反差'},
  {name:'加入具体数字'},
  {name:'温暖治愈风'},
  {name:'扎心真实风'},
  {name:'突出金句'}
];

function loadCustomTopics() {
  try { return JSON.parse(_ls.getItem(LS_TOPICS)||'[]'); } catch(e) { return []; }
}
function saveCustomTopics(arr) { _ls.setItem(LS_TOPICS, JSON.stringify(arr)); }
function loadCustomReqs() {
  try { return JSON.parse(_ls.getItem(LS_REQS)||'[]'); } catch(e) { return []; }
}
function saveCustomReqs(arr) { _ls.setItem(LS_REQS, JSON.stringify(arr)); }

// ============ 话题 checkboxes ============
function buildTopicLabel(item, isDefault) {
  const emoji = item.emoji || '📌';
  const delHtml = isDefault ? '' : '<span class="del" data-action="del-topic" data-name="' + escAttr(item.name) + '">×</span>';
  return '<label class="checked" data-topic="' + escAttr(item.name) + '">' +
    '<input type="checkbox" checked> ' + emoji + ' ' + escHtml(item.name) + delHtml + '</label>';
}

function renderTopics() {
  const customTopics = loadCustomTopics();
  const container = document.getElementById('topicChecks');
  let html = '';
  DEFAULT_TOPICS.forEach(t => { html += buildTopicLabel(t, true); });
  customTopics.forEach(t => { html += buildTopicLabel(t, false); });
  html += '<label id="addTopicBtn" style="border-style:dashed;" onclick="showTopicInput(event)">➕ 自定义</label>';
  container.innerHTML = html;
  container.querySelectorAll('label[data-topic]').forEach(l => {
    l.addEventListener('click', function(e) {
      if (e.target.classList.contains('del')) return;
      e.preventDefault();
      const cb = this.querySelector('input');
      cb.checked = !cb.checked;
      this.classList.toggle('checked', cb.checked);
    });
  });
  // 事件委托：删除按钮
  container.querySelectorAll('.del[data-action="del-topic"]').forEach(d => {
    d.addEventListener('click', function(e) {
      e.preventDefault(); e.stopPropagation();
      const name = this.dataset.name;
      if (!confirm('删除话题「' + name + '」？')) return;
      const topics = loadCustomTopics().filter(t => t.name !== name);
      saveCustomTopics(topics);
      renderTopics();
    });
  });
}

function getSelectedTopics() {
  return Array.from(document.querySelectorAll('#topicChecks input:checked'))
    .map(cb => cb.closest('label').dataset.topic)
    .filter(Boolean);
}

// --- custom topic add ---
function showTopicInput(e) {
  e.preventDefault(); e.stopPropagation();
  document.getElementById('topicInputRow').style.display = 'flex';
  document.getElementById('newTopicInput').focus();
}

function addCustomTopic() {
  const input = document.getElementById('newTopicInput');
  const name = input.value.trim();
  if (!name) return;
  // 检查是否与默认话题重名
  if (DEFAULT_TOPICS.some(t => t.name === name)) { alert('与默认话题重名'); return; }
  // 检查是否已存在
  const topics = loadCustomTopics();
  if (topics.some(t => t.name === name)) { alert('话题已存在'); return; }
  // 持久化
  topics.push({name: name});
  saveCustomTopics(topics);
  // 同时保存为类目
  api('/media/categories', { method:'POST', body:JSON.stringify({name:name}) }).then(() => loadCategories());
  // 刷新
  renderTopics();
  input.value = '';
  document.getElementById('topicInputRow').style.display = 'none';
}

function hideTopicInput() {
  document.getElementById('topicInputRow').style.display = 'none';
  document.getElementById('newTopicInput').value = '';
}

// ============ 额外要求 checkboxes ============
function buildReqLabel(item, isDefault) {
  const delHtml = isDefault ? '' : '<span class="del" data-action="del-req" data-name="' + escAttr(item.name) + '">×</span>';
  return '<label data-req="' + escAttr(item.name) + '">' +
    '<input type="checkbox"> 🎯 ' + escHtml(item.name) + delHtml + '</label>';
}

function renderReqs() {
  const customReqs = loadCustomReqs();
  const container = document.getElementById('reqChecks');
  let html = '';
  DEFAULT_REQS.forEach(r => { html += buildReqLabel(r, true); });
  customReqs.forEach(r => { html += buildReqLabel(r, false); });
  html += '<label id="addReqBtn" style="border-style:dashed;" onclick="showReqInput(event)">➕ 自定义</label>';
  container.innerHTML = html;
  container.querySelectorAll('label[data-req]').forEach(l => {
    l.addEventListener('click', function(e) {
      if (e.target.classList.contains('del')) return;
      e.preventDefault();
      const cb = this.querySelector('input');
      cb.checked = !cb.checked;
      this.classList.toggle('checked', cb.checked);
    });
  });
  // 事件委托：删除按钮
  container.querySelectorAll('.del[data-action="del-req"]').forEach(d => {
    d.addEventListener('click', function(e) {
      e.preventDefault(); e.stopPropagation();
      const name = this.dataset.name;
      if (!confirm('删除要求「' + name + '」？')) return;
      const reqs = loadCustomReqs().filter(r => r.name !== name);
      saveCustomReqs(reqs);
      renderReqs();
    });
  });
}

function getSelectedReqs() {
  return Array.from(document.querySelectorAll('#reqChecks input:checked'))
    .map(cb => cb.closest('label').dataset.req)
    .filter(Boolean);
}

function showReqInput(e) {
  e.preventDefault(); e.stopPropagation();
  document.getElementById('reqInputRow').style.display = 'flex';
  document.getElementById('newReqInput').focus();
}

function addCustomReq() {
  const input = document.getElementById('newReqInput');
  const name = input.value.trim();
  if (!name) return;
  if (DEFAULT_REQS.some(r => r.name === name)) { alert('与默认要求重名'); return; }
  const reqs = loadCustomReqs();
  if (reqs.some(r => r.name === name)) { alert('要求已存在'); return; }
  reqs.push({name: name});
  saveCustomReqs(reqs);
  renderReqs();
  input.value = '';
  document.getElementById('reqInputRow').style.display = 'none';
}

function hideReqInput() {
  document.getElementById('reqInputRow').style.display = 'none';
  document.getElementById('newReqInput').value = '';}

// 点页面其他地方关闭话题/要求输入
document.addEventListener('click', function(e) {
  const topicRow = document.getElementById('topicInputRow');
  const topicBtn = document.getElementById('addTopicBtn');
  const reqRow = document.getElementById('reqInputRow');
  const reqBtn = document.getElementById('addReqBtn');
  if (topicRow.style.display !== 'none' && !topicRow.contains(e.target) && e.target !== topicBtn && !topicBtn.contains(e.target)) {
    hideTopicInput();
  }
  if (reqRow.style.display !== 'none' && !reqRow.contains(e.target) && e.target !== reqBtn && !reqBtn.contains(e.target)) {
    hideReqInput();
  }
});
document.getElementById('newTopicInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') addCustomTopic();
});
document.getElementById('newReqInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') addCustomReq();
});

// --- pre-fill weather ---
(async function(){
  try {
    const w = await api('/weather');
    if (w && w.beijing && w.yuci) {
      const bj = w.beijing.current || {};
      const yc = w.yuci.current || {};
      document.getElementById('weatherInfo').placeholder =
        '北京'+(bj.temperature||'')+'° '+(bj.weatherDesc||'')+' / 太原'+(yc.temperature||'')+'° '+(yc.weatherDesc||'');
    }
  } catch(e){}
})();

// --- category tabs ---
document.getElementById('catTabs').addEventListener('click', function(e) {
  const tab = e.target.closest('.cat-tab');
  if (!tab) return;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('on'));
  tab.classList.add('on');
  activeCat = tab.dataset.cat;
  loadMaterials();
});

// --- Step 1: Generate ---
let currentPack = '';
function generate() {
  let topics = getSelectedTopics();
  const oneoffTopic = document.getElementById('oneoffTopic').value.trim();
  if (oneoffTopic) topics = topics.concat([oneoffTopic]);  // 单次话题追加
  if (topics.length === 0) { alert('请至少勾选一个话题或输入单次话题'); return; }

  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>生成中，约需30秒...';
  document.getElementById('result').innerHTML = '';

  let extraReqs = getSelectedReqs();
  const oneoffReq = document.getElementById('oneoffReq').value.trim();
  if (oneoffReq) extraReqs.push(oneoffReq);  // 单次要求追加

  api('/media/commute-pack', {
    method: 'POST',
    body: JSON.stringify({
      topics: topics,
      extra: extraReqs.join('、'),
      weather: document.getElementById('weatherInfo').value
    })
  }).then(data => {
    btn.disabled = false;
    btn.innerHTML = '🔄 重新生成';
    if (data.pack) { currentPack = data.pack; showPack(data.pack); }
    else { document.getElementById('result').innerHTML = '<div class="empty">生成失败</div>'; }
  }).catch(() => {
    btn.disabled = false;
    btn.innerHTML = '⚡ 生成脚本';
    document.getElementById('result').innerHTML = '<div class="empty">网络错误</div>';
  });
}

function showPack(content) {
  let html = content
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/━━━/g, '<hr>')
    .replace(/【(.+?)】/g, '<span class="hl">【$1】</span>')
    .replace(/\n/g, '<br>');

  document.getElementById('result').innerHTML = `
    <div class="pack">${html}</div>
    <div class="review-bar">
      <input id="reviewInput" placeholder="💬 评审意见：比如「节奏太快」「加乘务员互动细节」...">
    </div>
    <div class="action-bar">
      <button class="btn btn-sm btn-outline" onclick="revise()">✏️ 按意见修改</button>
      <button class="btn btn-sm btn-green" onclick="adopt()">✅ 采纳，存入素材库</button>
      <button class="btn btn-sm btn-outline" onclick="copyPack()">📋 复制全文</button>
    </div>`;
}

// --- Step 2: Revise ---
function revise() {
  const review = document.getElementById('reviewInput').value.trim();
  if (!review) { alert('请先输入评审意见'); return; }
  if (!currentPack) return;
  document.getElementById('result').innerHTML = '<div class="empty"><span class="spinner"></span>修改中...</div>';
  api('/media/revise', {
    method: 'POST',
    body: JSON.stringify({ previous: currentPack, review: review })
  }).then(data => {
    if (data.pack) { currentPack = data.pack; showPack(data.pack); }
    else { document.getElementById('result').innerHTML = '<div class="empty">修改失败</div>'; }
  }).catch(() => { document.getElementById('result').innerHTML = '<div class="empty">网络错误</div>'; });
}

// --- Step 3: Adopt with category ---
function adopt() {
  if (!currentPack) return;

  // 根据选中话题智能推荐类目
  const topics = getSelectedTopics();
  const defCat = topics.some(t => t.includes('周五') || t.includes('周一') || t.includes('通勤')) ? '通勤' :
                 topics.some(t => t.includes('工资') || t.includes('百万')) ? '工资' :
                 topics.some(t => t.includes('老婆') || t.includes('博士')) ? '老婆' :
                 topics.some(t => t.includes('娃') || t.includes('周末')) ? '带娃' :
                 topics.some(t => t.includes('大厂') || t.includes('京东') || t.includes('工位')) ? '大厂' :
                 (allCategories[0] ? allCategories[0].name : '其他');
  const catNames = allCategories.map(c => c.name).join('/');
  const cat = prompt('选择类目：' + catNames, defCat);
  if (!cat) return;
  const title = prompt('给这段素材起个名字：', '素材 ' + new Date().toLocaleDateString('zh-CN'));
  if (!title) return;

  api('/media/materials', {
    method: 'POST',
    body: JSON.stringify({
      title: title,
      topic: cat,
      template: getSelectedTopics().join('/'),
      content: currentPack
    })
  }).then(() => {
    alert('✅ 已存入素材库');
    loadMaterials();
  });
}

// --- Manual input ---
function toggleManual() {
  document.getElementById('manualForm').classList.toggle('on');
}

function saveManual() {
  const title = document.getElementById('manTitle').value.trim();
  const cat = document.getElementById('manCat').value;
  const customCat = document.getElementById('manCustomCat').value.trim();
  const content = document.getElementById('manContent').value.trim();

  if (!title) { alert('请输入标题'); return; }
  if (!content) { alert('请输入内容'); return; }

  const finalCat = (cat === '其他' && customCat) ? customCat : cat;

  api('/media/materials', {
    method: 'POST',
    body: JSON.stringify({ title: title, topic: finalCat, content: content, template: '手动录入' })
  }).then(() => {
    alert('✅ 已保存');
    document.getElementById('manTitle').value = '';
    document.getElementById('manContent').value = '';
    document.getElementById('manualForm').classList.remove('on');
    loadMaterials();
  });
}

// --- Materials ---
function loadMaterials() {
  const params = activeCat ? '?topic=' + encodeURIComponent(activeCat) : '';
  api('/media/materials' + params).then(data => {
    const list = Array.isArray(data) ? data : [];
    // count per category
    countByCat(list);

    if (list.length === 0) {
      document.getElementById('materialList').innerHTML = '<div class="empty">暂无素材，生成后点「✅ 采纳」或 ✏️ 手动录入</div>';
    } else {
      document.getElementById('materialList').innerHTML = list.map(m => `
        <div class="mat-card">
          <div class="mat-header">
            <div class="mat-title">${escHtml(m.title)}</div>
            <span class="mat-cat">${escHtml(m.topic||'未分类')}</span>
          </div>
          <div class="mat-preview">${escHtml((m.content||'').substring(0,120))}${(m.content||'').length>120?'...':''}</div>
          <div class="mat-actions">
            <button class="btn btn-sm btn-outline" onclick="viewMaterial('${m.id}')">📖 展开</button>
            <button class="btn btn-sm btn-outline" onclick="copyById('${m.id}')">📋 复制</button>
            <button class="btn btn-sm btn-outline" style="color:var(--red);" onclick="deleteMaterial('${m.id}')">🗑</button>
          </div>
          <div class="mat-time">${fmtTime(m.createdAt)}</div>
        </div>`).join('');
    }
  });
}

function countByCat(list) {
  // 清空所有计数
  document.querySelectorAll('#catTabs .count').forEach(el => el.textContent = '0');
  document.getElementById('cntAll').textContent = list.length;
  list.forEach(m => {
    const c = m.topic || '其他';
    const cntEl = document.getElementById('cnt' + c);
    if (cntEl) cntEl.textContent = (parseInt(cntEl.textContent)||0) + 1;
  });
}

function viewMaterial(id) {
  api('/media/scripts/' + id).then(data => {
    if (data && data.content) {
      showPack(data.content);
      window.scrollTo({ top: 0, behavior:'smooth' });
    }
  });
}

function copyById(id) {
  api('/media/scripts/' + id).then(data => {
    if (data && data.content) navigator.clipboard.writeText(data.content).then(() => alert('已复制'));
  });
}

function deleteMaterial(id) {
  if (!confirm('确认删除？')) return;
  api('/media/materials/' + id, { method:'DELETE' }).then(() => loadMaterials());
}

function copyPack() {
  if (!currentPack) return;
  navigator.clipboard.writeText(currentPack).then(() => alert('已复制'));
}

function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

if (TOKEN) {
  renderTopics();
  renderReqs();
  loadCategories();
  loadMaterials();
}
</script>
</body>
</html>
