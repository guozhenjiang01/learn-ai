<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>通勤素材包 · 我的玩具</title>
<style>
:root { --bg:#0d1117; --bg2:#161b22; --bg3:#21262d; --border:#30363d; --text:#c9d1d9; --text2:#8b949e; --orange:#f77f00; --green:#3fb950; --blue:#58a6ff; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
.topbar { background:linear-gradient(180deg,#160826,#1a0a20); padding:10px 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--border); }
.topbar a { color:var(--text2); text-decoration:none; font-size:14px; }
.topbar a:hover { color:var(--orange); }
.topbar .logo { font-size:16px; font-weight:700; color:var(--orange); }
.container { max-width:800px; margin:0 auto; padding:20px 16px; }

/* main card */
.card { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:24px; margin-bottom:16px; }
.card h2 { font-size:18px; color:var(--orange); margin-bottom:6px; }
.card .sub { font-size:13px; color:var(--text2); margin-bottom:16px; }

/* cycle viz */
.cycle { display:flex; align-items:center; gap:8px; margin-bottom:20px; flex-wrap:wrap; justify-content:center; }
.cycle .step { background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:10px 14px; text-align:center; min-width:80px; }
.cycle .step .day { font-size:11px; color:var(--text2); }
.cycle .step .label { font-size:13px; font-weight:600; margin-top:2px; }
.cycle .step .emoji { font-size:20px; }
.cycle .arrow { color:var(--orange); font-size:18px; }

/* inputs */
.input-row { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.input-row input { flex:1; min-width:200px; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:8px 12px; border-radius:8px; font-size:13px; }
.input-row input::placeholder { color:var(--text2); }

.btn { padding:10px 24px; border-radius:8px; font-size:14px; cursor:pointer; border:none; font-weight:600; transition:all .2s; }
.btn-primary { background:var(--orange); color:#fff; width:100%; }
.btn-primary:hover { background:#e06b00; }
.btn-primary:disabled { opacity:.5; cursor:not-allowed; }
.btn-sm { padding:5px 12px; font-size:12px; }

/* result */
.result { margin-top:20px; }
.result .pack { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:16px; white-space:pre-wrap; font-size:13px; line-height:1.7; max-height:70vh; overflow-y:auto; }
.result .pack .hl { color:var(--orange); font-weight:600; }
/* script separator */
.pack hr { border:none; border-top:2px dashed var(--border); margin:16px 0; }

.copy-bar { display:flex; gap:8px; margin-top:8px; justify-content:flex-end; }
.copy-bar .btn-sm { background:var(--bg3); color:var(--text2); border:1px solid var(--border); }

.spinner { display:inline-block; width:16px; height:16px; border:2px solid var(--border); border-top-color:#fff; border-radius:50%; animation:spin .6s linear infinite; margin-right:6px; vertical-align:middle; }
@keyframes spin { to{transform:rotate(360deg);} }
.empty { text-align:center; color:var(--text2); padding:30px; font-size:14px; }

/* mobile */
@media (max-width:600px) {
  .container { padding:10px; }
  .card { padding:16px; }
  .cycle { gap:4px; }
  .cycle .step { padding:8px 10px; min-width:65px; }
  .cycle .step .label { font-size:11px; }
  .input-row input { min-width:auto; }
}
</style>
</head>
<body>

<div class="topbar">
  <a href="/">← 返回</a>
  <span class="logo">🚄 通勤素材包</span>
</div>

<div class="container">

  <!-- cycle -->
  <div class="card">
    <h2>🎬 一周素材 · 一键生成</h2>
    <div class="sub">周五回太原 → 周末日常 → 周一返京，3条脚本一键生成</div>

    <div class="cycle">
      <div class="step">
        <div class="emoji">🚄</div>
        <div class="day">周五晚</div>
        <div class="label">回太原</div>
      </div>
      <div class="arrow">→</div>
      <div class="step">
        <div class="emoji">🏠</div>
        <div class="day">周末</div>
        <div class="label">太原日常</div>
      </div>
      <div class="arrow">→</div>
      <div class="step">
        <div class="emoji">🏢</div>
        <div class="day">周一早</div>
        <div class="label">返京通勤</div>
      </div>
    </div>

    <div class="input-row">
      <input id="extraHint" placeholder="额外要求（可不填）：比如这周下雨、孩子生病、加班到很晚...">
      <input id="weatherInfo" placeholder="天气（可不填）：比如北京30°晴、太原28°小雨...">
    </div>

    <button class="btn btn-primary" onclick="generate()" id="genBtn">⚡ 生成通勤素材包</button>

    <div class="result" id="result"></div>
  </div>

  <!-- history -->
  <div class="card" style="display:none;" id="historyCard">
    <h3 style="font-size:14px;margin-bottom:8px;">📚 历史生成</h3>
    <div id="historyList"></div>
  </div>

</div>

<script>
const TOKEN = localStorage.getItem('token') || '';
if (!TOKEN) { document.body.innerHTML = '<div class="empty" style="margin-top:60px;">⚠ 请先<a href="/">登录</a></div>'; }

function api(path, opts) {
  return fetch(window.location.origin + path, {
    ...opts,
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+TOKEN, ...(opts&&opts.headers||{}) }
  }).then(r => r.json());
}

// Pre-fill weather
(async function(){
  try {
    const w = await api('/weather');
    if (w && w.beijing && w.yuci) {
      const bj = w.beijing.current || {};
      const yc = w.yuci.current || {};
      document.getElementById('weatherInfo').placeholder =
        '北京'+(bj.temperature||'')+'° '+(bj.weatherDesc||'')+' / 太原'+(yc.temperature||'')+'° '+(yc.weatherDesc||'');
    }
  } catch(e){}
})();

function generate() {
  const btn = document.getElementById('genBtn');
  const extra = document.getElementById('extraHint').value;
  const weather = document.getElementById('weatherInfo').value;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>生成中，约需30秒...';
  document.getElementById('result').innerHTML = '';

  api('/media/commute-pack', {
    method: 'POST',
    body: JSON.stringify({ extra, weather })
  }).then(data => {
    btn.disabled = false;
    btn.innerHTML = '⚡ 生成通勤素材包';
    if (data.pack) {
      // simple markdown-ish formatting
      let html = data.pack
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/━━━/g, '<hr>')
        .replace(/【(.+?)】/g, '<span class="hl">【$1】</span>')
        .replace(/\n/g, '<br>');
      document.getElementById('result').innerHTML = '<div class="pack">' + html + '</div>' +
        '<div class="copy-bar"><button class="btn btn-sm" onclick="copyPack()">📋 复制全文</button></div>';
    } else {
      document.getElementById('result').innerHTML = '<div class="empty">生成失败，请重试</div>';
    }
  }).catch(err => {
    btn.disabled = false;
    btn.innerHTML = '⚡ 生成通勤素材包';
    document.getElementById('result').innerHTML = '<div class="empty">网络错误</div>';
  });
}

function copyPack() {
  const el = document.querySelector('.pack');
  if (!el) return;
  // get raw text (strip HTML)
  const text = el.innerText;
  navigator.clipboard.writeText(text).then(() => {
    alert('已复制到剪贴板');
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('已复制');
  });
}
</script>
</body>
</html>
