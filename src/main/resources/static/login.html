<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的玩具 · 登录</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, 'Noto Sans SC', sans-serif;
  background: #0d1117;
  color: #c9d1d9;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

/* Background stars */
body::before {
  content: '';
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none; opacity: 0.12;
  background-image:
    radial-gradient(1px 1px at 10% 20%, #f77f00, transparent),
    radial-gradient(1px 1px at 85% 15%, #f77f00, transparent),
    radial-gradient(1px 1px at 30% 80%, #f77f00, transparent),
    radial-gradient(1px 1px at 70% 90%, #e63946, transparent),
    radial-gradient(1px 1px at 50% 25%, #e63946, transparent),
    radial-gradient(2px 2px at 90% 60%, #fc9e2d, transparent),
    radial-gradient(2px 2px at 5% 50%, #fc9e2d, transparent),
    radial-gradient(1px 1px at 45% 70%, #f77f00, transparent),
    radial-gradient(1px 1px at 60% 10%, #f77f00, transparent);
}

.card {
  background: #161b22;
  border: 1px solid #f77f0040;
  border-radius: 16px;
  padding: 40px;
  width: 380px;
  position: relative;
  z-index: 1;
  box-shadow: 0 8px 40px rgba(0,0,0,.4), 0 0 30px #f77f0010;
}

/* Dragon Ball logo */
.db-logo {
  width: 60px; height: 60px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffb347, #f77f00 40%, #cc5200 90%);
  margin: 0 auto 12px;
  position: relative;
  box-shadow: 0 0 20px #f77f0040, 0 0 40px #f77f0020;
  animation: dbPulse 3s ease-in-out infinite;
}
.db-logo::before {
  content: '★★★';
  position: absolute;
  top: 14px; left: 10px;
  font-size: 13px; color: #e63946;
  letter-spacing: 3px;
  text-shadow: 0 0 4px #ff000080;
}
@keyframes dbPulse {
  0%,100% { box-shadow: 0 0 20px #f77f0040, 0 0 40px #f77f0020; }
  50% { box-shadow: 0 0 30px #f77f0060, 0 0 60px #f77f0030; }
}

.card h1 {
  text-align: center; margin-bottom: 4px; font-size: 22px; font-weight: 800;
}
.card h1 span { color: #f77f00; }
.card .sub {
  text-align: center; color: #484f58; font-size: 13px; margin-bottom: 28px;
}
.card input {
  width: 100%; background: #0d1117; border: 1px solid #30363d;
  border-radius: 8px; padding: 12px 16px; color: #c9d1d9;
  font-size: 14px; outline: none; margin-bottom: 12px;
  transition: border-color .2s;
}
.card input:focus { border-color: #f77f00; box-shadow: 0 0 0 3px #f77f0020; }
.card button {
  width: 100%; background: linear-gradient(135deg, #f77f00, #e06a00);
  border: none; color: #fff; padding: 12px; border-radius: 8px;
  cursor: pointer; font-size: 15px; font-weight: 700; margin-top: 4px;
  box-shadow: 0 2px 8px #f77f0040; transition: all .2s;
}
.card button:hover { filter: brightness(1.15); transform: translateY(-1px); }
.card button:active { transform: translateY(0); }
.card .switch { text-align: center; margin-top: 16px; font-size: 13px; color: #484f58; }
.card .switch a { color: #f77f00; cursor: pointer; text-decoration: none; }
.card .switch a:hover { text-decoration: underline; }
.card .msg { text-align: center; font-size: 13px; margin-top: 12px; min-height: 20px; }
.card .msg.error { color: #f85149; }
.card .msg.success { color: #3fb950; }
.card .admin-hint { text-align: center; font-size: 11px; color: #30363d; margin-top: 20px; }
.card .admin-hint span { color: #f77f00; }
</style>
</head>
<body>
<div class="card">
  <div class="db-logo"></div>
  <h1>我的<span>玩具</span></h1>
  <p class="sub" id="modeLabel">登录</p>
  <input type="text" id="username" placeholder="用户名" autocomplete="username">
  <input type="password" id="password" placeholder="密码" autocomplete="current-password">
  <button id="submitBtn" onclick="submit()">登 录</button>
  <div class="msg" id="msg"></div>
  <div class="switch">
    <span id="switchText">没有账号？</span> <a onclick="toggleMode()" id="switchLink">去注册</a>
  </div>
  <p class="admin-hint">💡 第一个注册的用户自动成为<span>超管</span></p>
</div>

<script>
let mode = 'login';

function toggleMode() {
  mode = mode === 'login' ? 'register' : 'login';
  document.getElementById('modeLabel').textContent = mode === 'login' ? '登录' : '注册';
  document.getElementById('submitBtn').textContent = mode === 'login' ? '登 录' : '注 册';
  document.getElementById('switchText').textContent = mode === 'login' ? '没有账号？' : '已有账号？';
  document.getElementById('switchLink').textContent = mode === 'login' ? '去注册' : '去登录';
  document.getElementById('msg').textContent = '';
  document.getElementById('msg').className = 'msg';
}

async function submit() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  if (!username || !password) {
    showMsg('请填写用户名和密码', 'error');
    return;
  }
  const url = mode === 'login' ? '/user/login' : '/user/register';
  try {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const d = await r.json();
    if (d.success) {
      if (mode === 'register') {
        showMsg('注册成功，请登录', 'success');
        toggleMode();
      } else {
        localStorage.setItem('token', d.token);
        localStorage.setItem('username', d.username);
        localStorage.setItem('role', d.role);
        localStorage.setItem('isAdmin', d.isAdmin ? '1' : '0');
        window.location.href = '/index.html';
      }
    } else {
      showMsg(d.message || '操作失败', 'error');
    }
  } catch(e) {
    showMsg('网络错误', 'error');
  }
}

function showMsg(text, cls) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + cls;
}

document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') submit();
});
</script>
</body>
</html>
