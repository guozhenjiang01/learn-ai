<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 问答助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; background: #f5f5f5; }
        .header { background: #4a90d9; color: white; padding: 16px; text-align: center; font-size: 18px; font-weight: 500; }
        .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 75%; padding: 12px 16px; border-radius: 16px; line-height: 1.5; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
        .message.user { align-self: flex-end; background: #4a90d9; color: white; border-bottom-right-radius: 4px; }
        .message.bot { align-self: flex-start; background: white; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .message.loading { color: #999; }
        .empty-hint { flex: 1; display: flex; align-items: center; justify-content: center; color: #999; font-size: 16px; }
        .input-area { display: flex; padding: 12px 16px; background: white; border-top: 1px solid #e0e0e0; gap: 10px; }
        .input-area input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 20px; font-size: 15px; outline: none; }
        .input-area input:focus { border-color: #4a90d9; }
        .input-area button { padding: 10px 20px; background: #4a90d9; color: white; border: none; border-radius: 20px; font-size: 15px; cursor: pointer; }
        .input-area button:hover { background: #3a7bc8; }
        .input-area button:disabled { background: #ccc; cursor: not-allowed; }
        @keyframes dot-pulse { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }
        .typing-dots span { animation: dot-pulse 1.4s infinite; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    </style>
</head>
<body>
    <div class="header">AI 问答助手</div>
    <div class="messages" id="messages">
        <div class="empty-hint" id="emptyHint">发送消息开始对话吧</div>
    </div>
    <div class="input-area">
        <input type="text" id="input" placeholder="输入你的问题..." autocomplete="off">
        <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const emptyHint = document.getElementById('emptyHint');
        let isLoading = false;

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function addMessage(text, type) {
            if (emptyHint) emptyHint.remove();
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = text;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return div;
        }

        function addLoadingMessage() {
            if (emptyHint) emptyHint.remove();
            const div = document.createElement('div');
            div.className = 'message bot loading';
            div.id = 'loadingMsg';
            div.innerHTML = '<span class="typing-dots"><span>.</span><span>.</span><span>.</span></span> 思考中';
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function removeLoadingMessage() {
            const el = document.getElementById('loadingMsg');
            if (el) el.remove();
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || isLoading) return;

            inputEl.value = '';
            isLoading = true;
            sendBtn.disabled = true;

            addMessage(text, 'user');
            addLoadingMessage();

            try {
                const response = await fetch(`/chat/deepSeekV4Pro?message=${encodeURIComponent(text)}`);
                removeLoadingMessage();

                if (response.ok) {
                    const reply = await response.text();
                    addMessage(reply, 'bot');
                } else {
                    addMessage(`请求失败：${response.status}`, 'bot');
                }
            } catch (e) {
                removeLoadingMessage();
                addMessage(`网络错误：${e.message}`, 'bot');
            }

            isLoading = false;
            sendBtn.disabled = false;
            inputEl.focus();
        }
    </script>
</body>
</html>
