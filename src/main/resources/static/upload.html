<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件上传</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; background: #f5f5f5; padding: 40px 16px; }
        .container { width: 100%; max-width: 600px; background: white; border-radius: 12px; padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #333; margin-bottom: 24px; font-size: 22px; }
        .upload-area { border: 2px dashed #ccc; border-radius: 8px; padding: 48px 24px; text-align: center; cursor: pointer; transition: all 0.3s; }
        .upload-area:hover, .upload-area.dragover { border-color: #4a90d9; background: #f0f7ff; }
        .upload-area p { color: #666; font-size: 15px; margin-top: 8px; }
        .upload-area .icon { font-size: 48px; color: #4a90d9; }
        .file-input { display: none; }
        .file-info { margin-top: 16px; padding: 12px; background: #f9f9f9; border-radius: 6px; display: none; }
        .file-info .name { font-weight: 500; color: #333; }
        .file-info .size { color: #999; font-size: 13px; margin-top: 4px; }
        .btn { display: block; width: 100%; margin-top: 20px; padding: 12px; background: #4a90d9; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #3a7bc8; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .result { margin-top: 16px; padding: 12px; border-radius: 6px; display: none; font-size: 14px; }
        .result.success { background: #f0fff4; color: #2d8a4e; border: 1px solid #c6f0d5; }
        .result.error { background: #fff5f5; color: #d32f2f; border: 1px solid #fdd; }
        .progress { margin-top: 12px; height: 6px; background: #eee; border-radius: 3px; overflow: hidden; display: none; }
        .progress-bar { height: 100%; background: #4a90d9; width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>
    <div class="container">
        <h1>文件上传</h1>
        <div class="upload-area" id="uploadArea">
            <div class="icon">&#128206;</div>
            <p>点击选择文件 或 拖拽文件到此处</p>
        </div>
        <input type="file" id="fileInput" class="file-input">
        <div class="file-info" id="fileInfo">
            <div class="name" id="fileName"></div>
            <div class="size" id="fileSize"></div>
        </div>
        <div class="progress" id="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <button class="btn" id="uploadBtn" disabled>上传文件</button>
        <div class="result" id="result"></div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const uploadBtn = document.getElementById('uploadBtn');
        const resultEl = document.getElementById('result');
        const progress = document.getElementById('progress');
        const progressBar = document.getElementById('progressBar');

        let selectedFile = null;

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                selectFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                selectFile(fileInput.files[0]);
            }
        });

        function selectFile(file) {
            selectedFile = file;
            fileName.textContent = file.name;
            fileSize.textContent = formatSize(file.size);
            fileInfo.style.display = 'block';
            uploadBtn.disabled = false;
            resultEl.style.display = 'none';
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            uploadBtn.disabled = true;
            progress.style.display = 'block';
            progressBar.style.width = '0%';
            resultEl.style.display = 'none';

            const formData = new FormData();
            formData.append('file', selectedFile);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/file/upload');

            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    progressBar.style.width = Math.round((e.loaded / e.total) * 100) + '%';
                }
            });

            xhr.onload = () => {
                progress.style.display = 'none';
                const data = JSON.parse(xhr.responseText);
                if (xhr.status === 200 && data.success) {
                    resultEl.className = 'result success';
                    resultEl.textContent = `上传成功！文件名：${data.originalFilename}，大小：${formatSize(data.size)}`;
                } else {
                    resultEl.className = 'result error';
                    resultEl.textContent = data.message || '上传失败';
                }
                resultEl.style.display = 'block';
                uploadBtn.disabled = false;
            };

            xhr.onerror = () => {
                progress.style.display = 'none';
                resultEl.className = 'result error';
                resultEl.textContent = '网络错误，请重试';
                resultEl.style.display = 'block';
                uploadBtn.disabled = false;
            };

            xhr.send(formData);
        });
    </script>
</body>
</html>
